schema:
  id_field: key
  header:
    - type: icon
      source: type
      variants:
        Bug: { icon: bug, intent: danger }
        Task: { icon: checkbox, intent: info }
    - { type: tag, source: key }
    - { type: text, source: summary, style: { bold: true } }
    - type: tag
      source: status
      variants:
        In Progress: { intent: info }
        Done: { intent: success }
  fields:
    - name: key
      label: Ticket
      type: text
      readonly: true
    - name: summary
      type: text
      required: true
    - name: description
      type: longtext
    - name: status
      type: enum
      options: [To Do, In Progress, Done]
    - name: labels
      type: multienum
      options: [backend, ui, bug]
    - name: points
      type: number
    - name: due
      type: date
    - name: blocked
      type: bool
entities:
  - key: PROJ-1
    type: Bug
    summary: Fix login
    description: Users cannot sign in after resetting a password.
    status: To Do
    labels: [bug]
    points: 3
    due: 2026-10-20
    blocked: false
  - key: PROJ-2
    type: Task
    summary: Improve import logs
    description: Show the row number in parsing errors.
    status: In Progress
    labels: [backend]
    points: 2
    due: 2026-10-27
    blocked: false
