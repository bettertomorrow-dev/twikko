# Two Jira-style issues. `key` identifies each entity. `header` draws the card
# header from entity data: an icon from `type`, a tag from `key`, the `summary`
# in bold, and a tag from `status`, which follows the user's edits. `type` and
# `url` are not in `fields`, so the user cannot edit them, and both come back
# unchanged in the output.
schema:
  id_field: key
  header:
    - type: icon
      source: type
      variants:
        Bug: { icon: bug, intent: danger }
        Task: { icon: checkbox, intent: info }
    - { type: tag, source: key }
    - type: text
      source: summary
      style: { bold: true }
    - { source: status }      # a control: the enum field picks a select
  body:
    - - { source: summary }
    - - { source: description }
    - - { source: labels }
      - { source: points }
    - - { source: due }
      - { source: review_at }
      - { type: toggle, source: blocked, label: Blocked }
  fields:
    - name: key
      label: Issue
      type: text
      readonly: true
    - name: summary
      type: text
      required: true
    - name: description
      type: longtext
    - name: status
      type: enum
      options: [To Do, In Progress, Done]
    - name: labels
      type: multienum
      options: [backend, ui, bug]
    - name: points
      type: number
    - name: due
      type: date
    - name: review_at
      type: datetime
    - name: blocked
      type: bool
entities:
  - key: PROJ-1
    type: Bug
    summary: Fix login
    description: Users cannot sign in after resetting a password.
    status: To Do
    labels: [bug]
    points: 3
    due: 2026-10-20
    review_at: 2026-10-29T15:30
    blocked: false
    url: https://jira.example.test/browse/PROJ-1
  - key: PROJ-2
    type: Task
    summary: Add CSV export
    status: In Progress
    labels: [ui]
    blocked: true
    url: https://jira.example.test/browse/PROJ-2
