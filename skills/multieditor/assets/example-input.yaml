# Two Jira-style issues. `key` identifies each entity. `card_title` is the card
# header text (see `title_field`). Neither `card_title` nor `url` is in
# `fields`, so the user cannot edit them, and both come back unchanged in the
# output.
schema:
  id_field: key
  title_field: card_title
  fields:
    - name: key
      label: Issue
      type: text
      readonly: true
    - name: summary
      type: text
      required: true
    - name: description
      type: longtext
    - name: status
      type: enum
      options: [To Do, In Progress, Done]
    - name: labels
      type: multienum
      options: [backend, ui, bug]
    - name: points
      type: number
    - name: due
      type: date
    - name: blocked
      type: bool
entities:
  - key: PROJ-1
    card_title: "PROJ-1 · Fix login"
    summary: Fix login
    description: Users cannot sign in after resetting a password.
    status: To Do
    labels: [bug]
    points: 3
    due: 2026-10-20
    blocked: false
    url: https://jira.example.test/browse/PROJ-1
  - key: PROJ-2
    card_title: "PROJ-2 · Add CSV export"
    summary: Add CSV export
    status: In Progress
    labels: [ui]
    blocked: true
    url: https://jira.example.test/browse/PROJ-2
